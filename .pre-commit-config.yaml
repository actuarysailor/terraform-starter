repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.100.0  # Use the latest stable version
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
      - id: terraform_docs
      - id: terraform_checkov
      - id: terraform_trivy

  - repo: https://github.com/tofuutils/pre-commit-opentofu
    rev: v2.2.1  # Use the latest stable version
    hooks:
      - id: tofu_fmt
      - id: tofu_validate
      - id: tofu_tflint
      - id: tofu_docs
      - id: tofu_checkov
      - id: tofu_trivy

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Use the latest stable version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Optionally, add yamllint for YAML files
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1  # Use the latest stable version
    hooks:
      - id: yamllint
